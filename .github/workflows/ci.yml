name: CI

# Bei jedem Push auf jeden Branch und jedem PR. Was geprüft wird, steht in
# verify.yml.
on:
  push:
  pull_request:
  workflow_dispatch:

# Ein zweiter Push auf denselben Branch macht den ersten Lauf gegenstandslos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
