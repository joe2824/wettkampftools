name: CI

# Bei Pushes auf main und dev sowie bei jedem PR; andere Branches
# prüft der PR, damit nichts doppelt läuft. Was geprüft wird, steht in verify.yml.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

# Ein zweiter Push auf denselben Branch macht den ersten Lauf gegenstandslos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
