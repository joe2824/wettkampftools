name: Verify

# Das gemeinsame Prüfwerk. Kein eigener Auslöser - CI und Release rufen es
# über `workflow_call` auf. Das Release lässt den Rust-Job aus und prüft Rust
# stattdessen im Release-Profil auf dem Build-Runner, damit Abhängigkeiten nur
# einmal kompiliert werden.
on:
  workflow_call:
    inputs:
      rust:
        description: "Rust auf Windows prüfen (Clippy und Tests im Debug-Profil)"
        type: boolean
        required: false
        default: true

jobs:
  code:
    name: Typen, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Tests
        run: npm test

      - name: Formatierung
        run: npm run format:check

      - name: Build
        run: npm run build

  # Auf windows-latest, weil die Anwendung nur dort läuft und #[cfg(windows)]-Code
  # auf Linux gar nicht kompiliert würde. Ohne Frontend-Build: ohne das Feature
  # `custom-protocol` bettet Tauri `frontendDist` nicht ein.
  rust:
    name: Rust
    if: inputs.rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Gemeinsamer Schlüssel mit dem Release-Build: derselbe Runner, derselbe
      # Ordner; der Cache gilt je Stand von Cargo.lock und wird auf dem Branch gespeichert.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # `clippy --all-targets` kompiliert die Tests, führt sie aber nicht aus.
      - name: Tests
        working-directory: src-tauri
        run: cargo test
