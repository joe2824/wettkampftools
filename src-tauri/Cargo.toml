[package]
name = "wettkampftools"
version = "2.0.0-beta.1"
description = "Wettkampftools für den DLRG Wellenwettkampf"
authors = ["Joel Klein"]
license = "MIT"
edition = "2021"

[lib]
# Der Suffix `_lib` verhindert unter Windows einen Namenskonflikt mit dem Binary,
# siehe https://github.com/rust-lang/cargo/issues/8519
name = "wettkampftools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Excel lesen (.xls/.xlsx) und schreiben.
calamine = "0.36"
rust_xlsxwriter = "0.99"
# Dokumenteigenschaften aus .xlsx lesen (ohnehin über calamine im Baum).
zip = { version = "8.6", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Zielpfad beim Schreiben von Ausgabedateien (ohnehin über tauri im Baum).
percent-encoding = "2"
# Pfade ohne Windows-Präfix \\?\ für Anzeige und Oberfläche (ohnehin über tauri im Baum).
dunce = "1"

[target.'cfg(windows)'.dependencies]
# Nur lesend: Einstellungen der alten Version übernehmen.
winreg = "0.56"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
